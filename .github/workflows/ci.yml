name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP checks and ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-xml php-sqlite3 shellcheck
      - name: Validate behavior, syntax and packaged installer
        run: nice -n 15 ionice -c3 bash scripts/check.sh
