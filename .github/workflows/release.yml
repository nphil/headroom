name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (YYYY.MM.DD.N)
        required: true
        type: string
      notes:
        description: Plain-text release notes
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: headroom-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release identity
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{1,3}$ ]]
          if git rev-parse --verify "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'A release tag already exists; choose a new version.' >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/headroom-notes.txt"
      - name: Install check dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-xml php-sqlite3 shellcheck
      - name: Check implementation
        run: nice -n 15 ionice -c3 bash scripts/check.sh
      - name: Build the release
        run: nice -n 15 ionice -c3 php scripts/build.php "$RELEASE_VERSION" "$RUNNER_TEMP/headroom-notes.txt"
      - name: Validate generated installer
        run: nice -n 15 ionice -c3 php scripts/check-installer.php headroom.plg
      - name: Publish source and immutable release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/version headroom.plg CHANGELOG.md
          git diff --cached --quiet || git commit -m "Release $RELEASE_VERSION"
          git tag "$RELEASE_VERSION"
          git push --atomic origin main "refs/tags/$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" "dist/headroom-$RELEASE_VERSION.tar.gz" dist/headroom.plg dist/SHA256SUMS --title "Headroom $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/headroom-notes.txt"
